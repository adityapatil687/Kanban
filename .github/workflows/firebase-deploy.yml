name: Deploy Kanban to Firebase Hosting

on:
  push:
    branches:
      - main  # Deploy when changes are pushed to 'main'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Set Node.js version as needed

      - name: Install Dependencies
        run: |
          cd kanban
          npm install  # Change if using yarn or pnpm

      - name: Build Project
        run: |
          cd kanban
          npm run build  # Adjust if necessary (e.g., npm run build:prod)

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live  # Change to "preview" for preview deployments
          entryPoint: kanban
